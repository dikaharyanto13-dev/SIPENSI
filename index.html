/* ─── CSV Parser & Loader ─── */
// Simple CSV parser that handles quoted fields
const parseCSVLine = (line) => {
  const result = [];
  let current = '';
  let inQuotes = false;
  
  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === ',' && !inQuotes) {
      result.push(current.trim());
      current = '';
    } else {
      current += char;
    }
  }
  result.push(current.trim());
  return result;
};

const parseCSV = (text) => {
  const lines = text.trim().split(/\r?\n/);
  const headers = parseCSVLine(lines[0]);
  return lines.slice(1).filter(line => line.trim()).map((line, idx) => {
    const values = parseCSVLine(line);
    const row = {};
    headers.forEach((h, i) => {
      let val = values[i] || '';
      // Handle NIP - strip extra quotes and handle scientific notation
      if (h === 'NIP') {
        val = val.replace(/"/g, ''); // Remove all quotes
        if (val.includes('E')) {
          val = String(Math.round(parseFloat(val)));
        }
      }
      // Handle TMT date format (M/D/YYYY to YYYY-MM-DD)
      if (h === 'TMT' || h === 'TMT. PENSIUN') {
        const parts = val.split('/');
        if (parts.length === 3) {
          val = `${parts[2].padStart(4, '20')}-${parts[0].padStart(2, '0')}-${parts[1].padStart(2, '0')}`;
        }
      }
      row[h] = val;
    });
    // Map CSV headers to app fields
    return {
      id: idx + 1,
      Nama: row['Nama'] || '',
      NIP: row['NIP'] || row['No'] || '',
      Pangkat: row['Pangkat'] || '',
      Jabatan: row['Jabatan Terakhir'] || row['Jabatan'] || '',
      TMT: row['TMT'] || row['TMT. PENSIUN'] || '',
      Unit: row['Unit Kerja'] || row['Unit'] || '',
      Operator: row['Operator'] || '',
      StatusPensiun: row['Status Pensiun'] || row['Janis Pensiun'] || 'BUP'
    };
  });
};

const normalizeData = (rawData) => {
  return rawData.map((row, idx) => ({
    id: idx + 1,
    Nama: row["Nama"] || row["nama"] || "",
    NIP: row["NIP"] || row["nip"] || row["No"] || "",
    Pangkat: row["Pangkat"] || row["pangkat"] || "",
    Jabatan: row["Jabatan Terakhir"] || row["jabatan"] || row["Jabatan"] || "",
    TMT: row["TMT. PENSIUN"] || row["TMT"] || "",
    Unit: row["Unit Kerja"] || row["Unit"] || "",
    Operator: row["Operator"] || "",
    StatusPensiun: row["Janis Pensiun"] || row["Status Pensiun"] || "BUP"
  }));
};

const loadData = async () => {
  const urls = [
    './data/datapensiun2026.xlsx',
    './data/data_pensiun_2026.xlsx',
    './data/datapensiun2026.csv',
    './data/data_pensiun_2026.csv'
  ];

  for (const url of urls) {
    try {
      const response = await fetch(url);
      if (!response.ok) continue;

      let rawData;
      if (url.endsWith(".xlsx")) {
        const buffer = await response.arrayBuffer();
        const workbook = XLSX.read(buffer, {type: "array"});
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        rawData = XLSX.utils.sheet_to_json(worksheet);
        console.log("XLSX loaded from", url, ":", rawData.length, "records");
      } else {
        const text = await response.text();
        rawData = parseCSV(text);
        console.log("CSV loaded from", url, ":", rawData.length, "records");
      }

      const data = normalizeData(rawData);
      return data.length > 0 ? data : null;
    } catch (e) {
      console.warn("Failed to load from", url, e);
      continue;
    }
  }

  console.warn("Could not load any data file");
  return null;
};

/* --- Status Logic --- */
const getStatusDetail = (pns) => {
  const tmtDate = new Date(pns.TMT);
  const today = new Date();
  const diffMonths = Math.ceil((tmtDate - today) / (1000*60*60*24*30.44));
  if (pns.Status === 'Done') return { urgency:'done', urgencyLabel:'Selesai', keterangan:'BERKAS RAMPUNG: Data telah divalidasi dan diusulkan ke BKN.' };
  if (diffMonths <= 0) return { urgency:'expired', urgencyLabel:'Lewat TMT', keterangan:'PERINGATAN: TMT sudah terlewati. Segera koordinasi Bidang Pensiun.' };
  if (diffMonths <= 3) return { urgency:'sangat-segera', urgencyLabel:'Sangat Segera', keterangan:'TINDAKAN CEPAT: Waktu < 3 Bulan. Kumpulkan Form DPCP hari ini.' };
  if (diffMonths <= 6) return { urgency:'segera', urgencyLabel:'Segera', keterangan:'PERSIAPAN: Sisa 4-6 bulan. Cek SK Pangkat & data keluarga SIASN.' };
  return { urgency:'menunggu', urgencyLabel:'Menunggu', keterangan:'MONITORING: Pastikan data profil di aplikasi sudah mutakhir.' };
};

// Access log storage
const getAccessLogs = () => {
  try {
    const logs = localStorage.getItem('accessLogs');
    return logs ? JSON.parse(logs) : [];
  } catch {
    return [];
  }
};

const addAccessLog = (username, action, details = '') => {
  try {
    const logs = getAccessLogs();
    const newLog = {
      id: Date.now(),
      username,
      action,
      details,
      timestamp: new Date().toISOString(),
      userAgent: navigator.userAgent
    };
    logs.unshift(newLog);
    // Keep only last 100 logs
    if (logs.length > 100) logs.pop();
    localStorage.setItem('accessLogs', JSON.stringify(logs));
  } catch (e) {
    console.error('Failed to save access log:', e);
  }
};

  const getAccessLogs = () => {
    try {
      const logs = localStorage.getItem('accessLogs');
      return logs ? JSON.parse(logs) : [];
    } catch {
      return [];
    }
  };

  const addAccessLog = (username, action, details = '') => {
    try {
      const logs = getAccessLogs();
      const newLog = {
        id: Date.now(),
        username,
        action,
        details,
        timestamp: new Date().toISOString(),
        userAgent: navigator.userAgent
      };
      logs.unshift(newLog);
      // Keep only last 100 logs
      if (logs.length > 100) logs.pop();
      localStorage.setItem('accessLogs', JSON.stringify(logs));
    } catch (e) {
      console.error('Failed to save access log:', e);
    }
  };

    if (username === 'user' && password === 'user234') {
      setCurrentUser({
        username,
        role: 'user',
        name: 'User Monitoring'
      });
      setIsLoggedIn(true);
      setLoginError('');
      // Log the login action
      addAccessLog(username, 'LOGIN', 'User Monitoring berhasil login');
    } else {
      // For admin/operator login, use hardcoded credentials
      const user = USERS[username];
      if (user && user.password === password) {
        setCurrentUser({ username, ...user });
        setIsLoggedIn(true);
        setLoginError('');
        // Log the login action
        addAccessLog(username, 'LOGIN', `${user.name} berhasil login`);

        if (user.role === 'superadmin') {
          setAccessLogs(getAccessLogs());
        }
      } else {
        setLoginError('Username atau password salah');

        addAccessLog(username, 'LOGIN_FAILED', 'Percobaan login gagal');

  useEffect(() => {
    try {
      localStorage.setItem('sipensi_phone', JSON.stringify(phoneNumbers));
    } catch {}
  }, [phoneNumbers]);

  const processed = useMemo(() =>
    data.map(item => ({ ...item, ...getStatusDetail(item) })).sort((a,b) => a.id-b.id),
    [data]
  );

  const filtered = useMemo(() => {
    const ql = q.toLowerCase();
    const fm = filterMonth ? String(filterMonth).padStart(2,'0') : '';
    return processed.filter(p => {
      const matchQ = !q || p.Nama.toLowerCase().includes(ql) || p.Operator.toLowerCase().includes(ql);
      const matchOp = !filterOp || p.Operator === filterOp;
      const matchM = !fm || p.TMT.substring(5,7) === fm;
      const matchStatus = statusFilter === 'all' || (p.StatusPensiun || 'BUP') === statusFilter;
      return matchQ && matchOp && matchM && matchStatus;
    });
  }, [processed, q, filterOp, filterMonth, statusFilter]);

  // Reset page when filters change - must be called unconditionally
  useEffect(() => {
    setCurrentPage(1);
  }, [q, filterOp, filterMonth, statusFilter]);

  // Conditional render: show login page or main app
  if (!isLoggedIn) {
    return <LoginPage onLogin={handleLogin} error={loginError} dark={dark} />;
  }

  // Pagination
  const totalPages = Math.ceil(filtered.length / itemsPerPage);
  const paginatedData = filtered.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

  const toggle = (id) => {
    if (!canEdit) return;
    setData(prev => prev.map(p => p.id===id ? {...p, Status:p.Status==='Done'?'Pending':'Done'} : p));
  };

  // Aggregates
  const total = processed.length;
  const bupCount = processed.filter(d=>(d.StatusPensiun||'BUP')==='BUP').length;
  const done = processed.filter(d=>d.Status==='Done').length;
  const urgent = processed.filter(d=>d.urgency==='sangat-segera'&&d.Status!=='Done').length;
  const expired = processed.filter(d=>d.urgency==='expired'&&d.Status!=='Done').length;
  const pct = p => Math.round((p/total)*100);

  const opStats = OPERATORS.map(op => {
    const list = processed.filter(d=>d.Operator===op);
    const doneN = list.filter(d=>d.Status==='Done').length;
    return { op, total:list.length, done:doneN, pct:list.length?Math.round((doneN/list.length)*100):0 };
  });

  const monthStats = Array.from({length:12},(_,i)=>{
    const m = String(i+1).padStart(2,'0');
    const list = processed.filter(d=>d.TMT.substring(5,7)===m);
    return { m:i+1, label:MONTHS[i+1], count:list.length, done:list.filter(d=>d.Status==='Done').length };
  }).filter(x=>x.count>0);

  // Theme
  const bg = dark?'#0f172a':'#f1f5f9';
  const card = dark?'#1e293b':'#fff';
  const border = dark?'#334155':'#e2e8f0';
  const muted = dark?'#94a3b8':'#64748b';
  const text = dark?'#f1f5f9':'#0f172a';
  const inp = dark?'#0f172a':'#f8fafc';

  const selStyle = {
    padding:'7px 10px', borderRadius:8, border:`1px solid ${border}`,
    background:inp, color:text, fontSize:12, fontWeight:600, outline:'none', cursor:'pointer'
  };

  return (
    <div style={{ minHeight:'100vh', display:'flex', background:bg, color:text, fontFamily:"'Segoe UI',system-ui,sans-serif", fontSize:13 }}>

      {/* SIDEBAR */}
      {sidebar && (
        <aside style={{ width:220, flexShrink:0, background:card, borderRight:`1px solid ${border}`, display:'flex', flexDirection:'column', position:'sticky', top:0, height:'100vh', overflowY:'auto' }}>
          {/* Logo */}
          <div style={{ padding:'18px 16px', borderBottom:`1px solid ${border}`, display:'flex', alignItems:'center', gap:12 }}>
            <img src="logo.png" alt="Logo Pvt" style={{ width:44, height:44, objectFit:'contain', borderRadius:10, flexShrink:0 }} />
            <div>
              <div style={{ fontWeight:900, fontSize:18, background:'linear-gradient(135deg,#6366f1,#8b5cf6)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent', letterSpacing:'-0.02em', fontStyle:'italic' }}>SIPENSI</div>
              <div style={{ fontSize:10, color:muted, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.08em', marginTop:2 }}>Sistem Informasi & Monitoring Pensiun</div>
            </div>
          </div>
          {/* Nav */}
          <nav style={{ padding:'12px 10px', display:'flex', flexDirection:'column', gap:4 }}>
            {[
              { id:'dashboard', label:'Statistik Terkini', icon:<I.dash s={15}/> },
              { id:'monitoring', label:'Database Pegawai', icon:<I.users s={15}/> },
              ...(canAdd ? [{ id:'tambah', label:'Tambah Pegawai', icon:<I.person s={15}/> }] : []),
              ...(isSuperAdmin ? [{ id:'logs', label:'Log Akses', icon:<I.shield s={15}/> }] : []),
            ].map(nav => (
              <button key={nav.id} onClick={()=>setTab(nav.id)} style={{ display:'flex', alignItems:'center', gap:8, padding:'9px 12px', borderRadius:9, border:'none', cursor:'pointer', fontWeight:700, fontSize:12, textAlign:'left', background:tab===nav.id?'#4f46e5':'transparent', color:tab===nav.id?'#fff':muted, transition:'all 0.15s' }}>
                {nav.icon}{nav.label}
              </button>
            ))}
          </nav>
          {/* Operator legend */}
          <div style={{ padding:'0 10px 10px', marginTop:8 }}>
            <p style={{ fontSize:9, fontWeight:700, color:muted, textTransform:'uppercase', letterSpacing:'0.1em', padding:'0 4px', marginBottom:6 }}>Operator</p>
            <div style={{ display:'flex', alignItems:'center', gap:6, padding:'5px 8px', borderRadius:7, marginBottom:2, background: filterOp===''?(dark?'#1e3a5f':'#eef2ff'):'transparent', cursor:'pointer' }} onClick={()=>{ setFilterOp(''); setTab('monitoring'); }}>
              <div style={{ width:8, height:8, borderRadius:99, background:'#64748b', flexShrink:0 }}/>
              <span style={{ fontSize:11, fontWeight:700, color: filterOp===''?'#4f46e5':muted, transition:'color 0.15s' }}>TOTAL</span>
              <span style={{ marginLeft:'auto', fontSize:10, background: dark?'#334155':'#f1f5f9', color:muted, padding:'1px 5px', borderRadius:4, fontWeight:700 }}>
                {processed.length}
              </span>
            </div>
            {OPERATORS.map(op => (
              <div key={op} style={{ display:'flex', alignItems:'center', gap:6, padding:'5px 8px', borderRadius:7, marginBottom:2, background: filterOp===op?(dark?'#1e3a5f':'#eef2ff'):'transparent', cursor:'pointer' }} onClick={()=>{ setFilterOp(filterOp===op?'':op); setTab('monitoring'); }}>
                <div style={{ width:8, height:8, borderRadius:99, background:OP_COLORS[op], flexShrink:0 }}/>
                <span style={{ fontSize:11, fontWeight:700, color: filterOp===op?'#4f46e5':muted, transition:'color 0.15s' }}>{op}</span>
                <span style={{ marginLeft:'auto', fontSize:10, background: dark?'#334155':'#f1f5f9', color:muted, padding:'1px 5px', borderRadius:4, fontWeight:700 }}>
                  {processed.filter(d=>d.Operator===op).length}
                </span>
              </div>
            ))}
          </div>
          {/* Status summary */}
          <div style={{ padding:'0 10px 10px', marginTop:8 }}>
            <p style={{ fontSize:9, fontWeight:700, color:muted, textTransform:'uppercase', letterSpacing:'0.1em', padding:'0 4px', marginBottom:6 }}>Ringkasan Status</p>
            <div style={{ display:'flex', alignItems:'center', gap:6, padding:'5px 8px', borderRadius:7, marginBottom:2, background: dark?'#1e3a5f':'#eef2ff' }}>
              <div style={{ width:8, height:8, borderRadius:99, background:'#2563eb', flexShrink:0 }}/>
              <span style={{ fontSize:11, fontWeight:700, color:'#2563eb' }}>BUP</span>
              <span style={{ marginLeft:'auto', fontSize:10, background: dark?'#334155':'#f1f5f9', color:muted, padding:'1px 5px', borderRadius:4, fontWeight:700 }}>
                {processed.filter(d=>(d.StatusPensiun||'BUP')==='BUP').length}
              </span>
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:6, padding:'5px 8px', borderRadius:7, marginBottom:2, background: dark?'#1e3a5f':'#fef2f2' }}>
              <div style={{ width:8, height:8, borderRadius:99, background:'#dc2626', flexShrink:0 }}/>
              <span style={{ fontSize:11, fontWeight:700, color:'#dc2626' }}>MD</span>
              <span style={{ marginLeft:'auto', fontSize:10, background: dark?'#334155':'#f1f5f9', color:muted, padding:'1px 5px', borderRadius:4, fontWeight:700 }}>
                {processed.filter(d=>(d.StatusPensiun||'BUP')==='MD').length}
              </span>
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:6, padding:'5px 8px', borderRadius:7, marginBottom:2, background: dark?'#1e3a5f':'#fffbeb' }}>
              <div style={{ width:8, height:8, borderRadius:99, background:'#d97706', flexShrink:0 }}/>
              <span style={{ fontSize:11, fontWeight:700, color:'#d97706' }}>APS</span>
              <span style={{ marginLeft:'auto', fontSize:10, background: dark?'#334155':'#f1f5f9', color:muted, padding:'1px 5px', borderRadius:4, fontWeight:700 }}>
                {processed.filter(d=>(d.StatusPensiun||'BUP')==='APS').length}
              </span>
            </div>
          </div>
          {/* Bottom info */}
          <div style={{ marginTop:'auto', padding:'12px 10px' }}>
            <div style={{ background: isSuperAdmin ? 'linear-gradient(135deg,#dc2626,#e11d48)' : isOperator ? 'linear-gradient(135deg,#d97706,#ea580c)' : 'linear-gradient(135deg,#10b981,#059669)', borderRadius:12, padding:'12px', color:'#fff' }}>
              <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:6 }}>
                {isSuperAdmin ? <I.shield s={13}/> : isOperator ? <I.users s={13}/> : <I.lock s={13}/>}<span style={{ fontSize:10, fontWeight:900, textTransform:'uppercase', letterSpacing:'0.05em' }}>{isSuperAdmin ? 'Super Admin' : isOperator ? 'Operator' : 'User (View Only)'}</span>
              </div>
              <div style={{ fontSize:10, opacity:0.85, lineHeight:1.5, fontWeight:600 }}>
              {currentUser?.name}<br/>{total} Pegawai
              </div>
              <div style={{ marginTop:8, height:4, background:'rgba(255,255,255,0.2)', borderRadius:99, overflow:'hidden' }}>
                <div style={{ height:'100%', width:`${pct(done)}%`, background:'#a5f3fc', borderRadius:99 }}/>
              </div>
              <div style={{ fontSize:9, opacity:0.8, marginTop:4, fontWeight:700 }}>{done}/{total} Selesai ({pct(done)}%)</div>
            </div>
          </div>
        </aside>
      )}

      {/* MAIN */}
      <main style={{ flex:1, overflow:'auto', minWidth:0 }}>
        {/* Header */}
        <div style={{ position:'sticky', top:0, zIndex:10, background:card, borderBottom:`1px solid ${border}`, padding:'10px 20px', display:'flex', alignItems:'center', gap:12 }}>
          <button onClick={()=>setSidebar(!sidebar)} style={{ padding:7, borderRadius:8, border:`1px solid ${border}`, background:'transparent', cursor:'pointer', color:'#4f46e5', display:'flex', alignItems:'center' }}>
            {sidebar?<I.chevL s={16}/>:<I.menu s={16}/>}
          </button>
          <div style={{ flex:1 }}>
            <h1 style={{ fontSize:16, fontWeight:900, margin:0, letterSpacing:'-0.03em', display:'flex', alignItems:'center', gap:8 }}>
              <span style={{ color:'#4f46e5' }}>Data Pensiun 2026</span>
              </h1>
            <p style={{ fontSize:10, color:muted, fontWeight:600, margin:0, textTransform:'uppercase', letterSpacing:'0.06em' }}>Monitoring Data · Kota Ternate</p>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:6, padding:'4px 8px', borderRadius:8, border:`1px solid ${border}`, background:'transparent' }}>
            <div style={{ width:24, height:24, borderRadius:99, background: isSuperAdmin ? '#dc2626' : isOperator ? '#d97706' : '#10b981', display:'flex', alignItems:'center', justifyContent:'center' }}>
              {isSuperAdmin ? <I.shield s={12} st={{ color:'#fff' }}/> : isOperator ? <I.users s={12} st={{ color:'#fff' }}/> : <I.lock s={12} st={{ color:'#fff' }}/>}
            </div>
            <div style={{ textAlign:'left' }}>
              <p style={{ fontSize:10, fontWeight:700, color:text, margin:0 }}>{currentUser?.name}</p>
              <p style={{ fontSize:8, fontWeight:600, color: isSuperAdmin ? '#f87171' : isOperator ? '#fbbf24' : '#34d399', margin:0 }}>{isSuperAdmin ? 'Super Admin' : isOperator ? 'Operator' : 'User'}</p>
            </div>
          </div>
          <button onClick={handleLogout} style={{ padding:7, borderRadius:8, border:`1px solid ${border}`, background:'transparent', cursor:'pointer', display:'flex', alignItems:'center', color:'#94a3b8' }}>
            <I.logout s={16}/>
          </button>
          <button onClick={()=>setDark(!dark)} style={{ padding:7, borderRadius:8, border:`1px solid ${border}`, background:'transparent', cursor:'pointer', display:'flex', alignItems:'center', color:dark?'#fbbf24':'#4f46e5' }}>
            {dark?<I.sun s={16}/>:<I.moon s={16}/>}
          </button>
        </div>

        <div style={{ padding:'16px 20px' }}>

          {/* ══ DASHBOARD TAB ══ */}
          {tab==='dashboard' && (
            <div style={{ display:'flex', flexDirection:'column', gap:16 }}>

              {/* Top stat cards */}
              <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))', gap:10 }}>
                <StatCard label="Total Database" value={total} icon={<I.users s={18}/>} accent="#4f46e5" sub={`${total} Pegawai`}/>
                <StatCard label="BUP" value={bupCount} icon={<I.users s={18}/>} accent="#2563eb" sub={`Batas Usia Pensiun`}/>
                <StatCard label="MD" value={processed.filter(d=>(d.StatusPensiun||'BUP')==='MD').length} icon={<I.users s={18}/>} accent="#dc2626" sub={`Meninggal Dunia`}/>
                <StatCard label="APS" value={processed.filter(d=>(d.StatusPensiun||'BUP')==='APS').length} icon={<I.users s={18}/>} accent="#d97706" sub={`Pensiun Dini`}/>
                <StatCard label="Berkas Selesai" value={done} icon={<I.check2 s={18}/>} accent="#16a34a" sub={`${pct(done)}%`}/>
                <StatCard label="Belum Selesai" value={total-done} icon={<I.clock s={18}/>} accent="#d97706" sub={`${pct(total-done)}%`}/>
                <StatCard label="Sangat Urgent" value={urgent} icon={<I.alert s={18}/>} accent="#dc2626" sub="TMT < 3 bln"/>
                <StatCard label="Lewat TMT" value={expired} icon={<I.xmark s={18}/>} accent="#64748b" sub="Perlu koordinasi segera"/>
              </div>

              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
                {/* Operator performance */}
                <div style={{ background:card, border:`1px solid ${border}`, borderRadius:14, padding:'16px 18px' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:14 }}>
                    <I.person s={14} st={{ color:'#4f46e5' }}/>
                    <h3 style={{ fontSize:13, fontWeight:800, margin:0 }}>Progress per Operator</h3>
                  </div>
                  <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
                    {opStats.map(({op, total:t, done:d, pct:p}) => (
                      <div key={op}>
                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:5 }}>
                          <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                            <div style={{ width:10, height:10, borderRadius:99, background:OP_COLORS[op] }}/>
                            <span style={{ fontSize:12, fontWeight:700, color:text }}>{op}</span>
                          </div>
                          <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                            <span style={{ fontSize:11, color:muted, fontWeight:600 }}>{d}/{t}</span>
                            <span style={{ fontSize:11, fontWeight:800, color:OP_COLORS[op] }}>{p}%</span>
                          </div>
                        </div>
                        <Bar pct={p} color={OP_COLORS[op]}/>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Monthly distribution */}
                <div style={{ background:card, border:`1px solid ${border}`, borderRadius:14, padding:'16px 18px' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:14 }}>
                    <I.calendar s={14} st={{ color:'#4f46e5' }}/>
                    <h3 style={{ fontSize:13, fontWeight:800, margin:0 }}>Distribusi per Bulan TMT</h3>
                  </div>
                  <div style={{ display:'flex', flexDirection:'column', gap:7 }}>
                    {monthStats.map(({m, label, count, done:d}) => (
                      <div key={m} style={{ display:'flex', alignItems:'center', gap:8 }}>
                        <span style={{ fontSize:11, fontWeight:700, color:muted, width:28, flexShrink:0 }}>{label}</span>
                        <div style={{ flex:1, display:'flex', alignItems:'center', gap:6 }}>
                          <div style={{ height:14, display:'flex', borderRadius:4, overflow:'hidden', gap:1, flex:1 }}>
                            <div style={{ background:'#4ade80', width:`${Math.round((d/count)*100)}%`, minWidth:d>0?4:0 }}/>
                            <div style={{ background:'#c7d2fe', flex:1 }}/>
                          </div>
                          <span style={{ fontSize:10, fontWeight:700, color:muted, width:20, textAlign:'right', flexShrink:0 }}>{count}</span>
                        </div>
                      </div>
                    ))}
                    <div style={{ display:'flex', alignItems:'center', gap:12, marginTop:4, paddingTop:10, borderTop:`1px solid ${border}` }}>
                      <div style={{ display:'flex', alignItems:'center', gap:4 }}><div style={{ width:10,height:10,background:'#4ade80',borderRadius:2 }}/><span style={{ fontSize:10, color:muted, fontWeight:600 }}>Selesai</span></div>
                      <div style={{ display:'flex', alignItems:'center', gap:4 }}><div style={{ width:10,height:10,background:'#c7d2fe',borderRadius:2 }}/><span style={{ fontSize:10, color:muted, fontWeight:600 }}>Belum</span></div>
                    </div>
                  </div>
                </div>
              </div>

              {/* Urgency breakdown */}
              <div style={{ background:card, border:`1px solid ${border}`, borderRadius:14, padding:'16px 18px' }}>
                <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:14 }}>
                  <I.bar s={14} st={{ color:'#4f46e5' }}/>
                  <h3 style={{ fontSize:13, fontWeight:800, margin:0 }}>Distribusi Urgensi</h3>
                </div>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(5,1fr)', gap:8 }}>
                  {[
                    { key:'done',         label:'Selesai',       accent:'#16a34a', bg:'#f0fdf4' },
                    { key:'menunggu',     label:'Menunggu',      accent:'#4338ca', bg:'#eef2ff' },
                    { key:'segera',       label:'Segera',        accent:'#d97706', bg:'#fffbeb' },
                    { key:'sangat-segera',label:'Sangat Segera', accent:'#dc2626', bg:'#fef2f2' },
                    { key:'expired',      label:'Lewat TMT',     accent:'#475569', bg:'#f8fafc' },
                  ].map(({key, label, accent, bg:ubg}) => {
                    const n = processed.filter(d => key==='done' ? d.Status==='Done' : d.urgency===key && d.Status!=='Done').length;
                    return (
                      <div key={key} style={{ background:ubg, borderRadius:10, padding:'12px', textAlign:'center', border:`1px solid ${accent}22` }}>
                        <p style={{ fontSize:22, fontWeight:900, color:accent, margin:0, lineHeight:1 }}>{n}</p>
                        <p style={{ fontSize:10, color:accent, fontWeight:700, margin:'4px 0 0', opacity:0.8 }}>{label}</p>
                        <p style={{ fontSize:10, color:accent, opacity:0.6, margin:'2px 0 0', fontWeight:600 }}>{pct(n)}%</p>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Operator detail table */}
              <div style={{ background:card, border:`1px solid ${border}`, borderRadius:14, padding:'16px 18px' }}>
                <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:12 }}>
                  <I.users s={14} st={{ color:'#4f46e5' }}/>
                  <h3 style={{ fontSize:13, fontWeight:800, margin:0 }}>Rekapitulasi per Operator</h3>
                </div>
                <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
                  <thead>
                    <tr style={{ background:dark?'#0f172a':'#f8fafc' }}>
                      {['Operator','Total','Selesai','Belum','Sangat Urgent','Progress'].map((h,i) => (
                        <th key={i} style={{ padding:'8px 12px', fontWeight:700, color:muted, textAlign:i===0?'left':'center', fontSize:11, textTransform:'uppercase', letterSpacing:'0.05em', borderBottom:`1px solid ${border}` }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {opStats.map(({op, total:t, done:d}) => {
                      const urgN = processed.filter(x=>x.Operator===op&&x.urgency==='sangat-segera'&&x.Status!=='Done').length;
                      const p2 = t?Math.round((d/t)*100):0;
                      return (
                        <tr key={op} style={{ borderBottom:`1px solid ${border}` }}>
                          <td style={{ padding:'9px 12px' }}>
                            <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                              <div style={{ width:8,height:8,background:OP_COLORS[op],borderRadius:99,flexShrink:0 }}/>
                              <span style={{ fontWeight:700 }}>{op}</span>
                            </div>
                          </td>
                          <td style={{ textAlign:'center', fontWeight:700, padding:'9px 12px' }}>{t}</td>
                          <td style={{ textAlign:'center', padding:'9px 12px' }}><span style={{ background:'#f0fdf4', color:'#16a34a', padding:'2px 8px', borderRadius:5, fontWeight:700, fontSize:11 }}>{d}</span></td>
                          <td style={{ textAlign:'center', padding:'9px 12px' }}><span style={{ background:'#fffbeb', color:'#d97706', padding:'2px 8px', borderRadius:5, fontWeight:700, fontSize:11 }}>{t-d}</span></td>
                          <td style={{ textAlign:'center', padding:'9px 12px' }}><span style={{ background: urgN>0?'#fef2f2':'#f0fdf4', color:urgN>0?'#dc2626':'#94a3b8', padding:'2px 8px', borderRadius:5, fontWeight:700, fontSize:11 }}>{urgN}</span></td>
                          <td style={{ padding:'9px 12px' }}>
                            <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                              <Bar pct={p2} color={OP_COLORS[op]}/>
                              <span style={{ fontSize:11, fontWeight:800, color:OP_COLORS[op], width:32, textAlign:'right' }}>{p2}%</span>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* ══ MONITORING TAB ══ */}
          {tab==='monitoring' && (
            <div>
              {/* Filter bar */}
              <div style={{ background:card, border:`1px solid ${border}`, borderRadius:12, padding:'10px 14px', marginBottom:12, display:'flex', flexWrap:'wrap', gap:8, alignItems:'center' }}>
                <div style={{ position:'relative', flex:'1 1 200px', minWidth:160 }}>
                  <span style={{ position:'absolute', left:10, top:'50%', transform:'translateY(-50%)', color:muted, display:'flex', pointerEvents:'none' }}><I.search s={14}/></span>
                  <input type="text" placeholder="Cari nama atau operator…" value={q} onChange={e=>setQ(e.target.value)}
                    style={{ ...selStyle, paddingLeft:30, width:'100%' }} />
                </div>
                <select value={filterOp} onChange={e=>setFilterOp(e.target.value)} style={selStyle}>
                  <option value="">Total Semua</option>
                  {OPERATORS.map(op=><option key={op} value={op}>{op}</option>)}
                </select>
                <select value={filterMonth} onChange={e=>setFilterMonth(e.target.value)} style={selStyle}>
                  <option value="">Semua Bulan TMT</option>
                  {Array.from({length:12},(_,i)=><option key={i+1} value={i+1}>{MONTHS[i+1]}</option>)}
                </select>
                <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={selStyle}>
                   <option value="all">Semua Jenis ({total})</option>
                   <option value="BUP">BUP ({bupCount})</option>
                   <option value="MD">MD ({processed.filter(d=>(d.StatusPensiun||'BUP')==='MD').length})</option>
                   <option value="APS">APS ({processed.filter(d=>(d.StatusPensiun||'BUP')==='APS').length})</option>
                 </select>

                {(q||filterOp||filterMonth||statusFilter!=='all') && (
                  <button onClick={()=>{setQ('');setFilterOp('');setFilterMonth('');setStatusFilter('all');}} style={{ padding:'7px 12px', borderRadius:8, border:`1px solid ${border}`, background:'transparent', cursor:'pointer', color:'#dc2626', fontSize:11, fontWeight:700, display:'flex', alignItems:'center', gap:4 }}>
                    <I.xmark s={12}/> Reset
                  </button>
                )}
                <button onClick={()=>{
                  try {
                    // Export to Excel
                    const wsData = [
                      ['No', 'Nama', 'NIP', 'Pangkat', 'Jabatan', 'Unit Kerja', 'TMT', 'Status Pensiun', 'Status Monitoring', 'Urgensi', 'Nomor HP']
                    ];
                    filtered.forEach((p, idx) => {
                      wsData.push([
                        idx + 1,
                        p.Nama,
                        p.NIP || '',
                        p.Pangkat,
                        p.Jabatan,
                        p.Unit,
                        p.TMT,
                        p.StatusPensiun || 'BUP',
                        p.Status === 'Done' ? 'Selesai' : 'Pending',
                        p.urgencyLabel,
                        phoneNumbers[p.id] || ''
                      ]);
                    });
                    const ws = XLSX.utils.aoa_to_sheet(wsData);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, 'Data Pensiun');
                    XLSX.writeFile(wb, `sipensi_monitoring_${new Date().toISOString().split('T')[0]}.xlsx`);
                  } catch (err) {
                    alert('Gagal mengekspor Excel: ' + err.message);
                  }
                }} style={{ padding:'7px 14px', borderRadius:8, border:'none', background:'#7c3aed', cursor:'pointer', color:'#fff', fontSize:11, fontWeight:700, display:'flex', alignItems:'center', gap:4 }}>
                  <I.clip s={12}/> Excel
                </button>
                <button onClick={()=>{
                  try {
                    // Export to PDF
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    const tableData = filtered.map((p, idx) => [
                      idx + 1,
                      p.Nama,
                      p.Pangkat,
                      p.Jabatan.substring(0, 25) + (p.Jabatan.length > 25 ? '...' : ''),
                      p.Unit.substring(0, 20) + (p.Unit.length > 20 ? '...' : ''),
                      p.TMT,
                      'BUP',
                      p.Status === 'Done' ? 'Selesai' : 'Pending',
                      p.urgencyLabel,
                      phoneNumbers[p.id] || '-'
                    ]);
                    doc.autoTable({
                      head: [['No', 'Nama', 'Pangkat', 'Jabatan', 'Unit', 'TMT', 'Jenis', 'Status', 'Urgensi', 'No. HP']],
                      body: tableData,
                      startY: 20,
                      styles: { fontSize: 7, cellPadding: 2, overflow: 'linebreak' },
                      headStyles: { fillColor: [79, 70, 229] },
                      columnStyles: {
                        0: { cellWidth: 8 },
                        1: { cellWidth: 35 },
                        2: { cellWidth: 12 },
                        3: { cellWidth: 30 },
                        4: { cellWidth: 25 },
                        5: { cellWidth: 15 },
                        6: { cellWidth: 10 },
                        7: { cellWidth: 12 },
                        8: { cellWidth: 18 },
                        9: { cellWidth: 20 }
                      }
                    });
                    doc.text('Data Pensiun Kota Ternate 2026', 14, 15);
                    doc.save(`sipensi_monitoring_${new Date().toISOString().split('T')[0]}.pdf`);
                  } catch (err) {
                    alert('Gagal mengekspor PDF: ' + err.message);
                  }
                }} style={{ padding:'7px 14px', borderRadius:8, border:'none', background:'#dc2626', cursor:'pointer', color:'#fff', fontSize:11, fontWeight:700, display:'flex', alignItems:'center', gap:4 }}>
                  <I.clip s={12}/> PDF
                </button>
                <span style={{ fontSize:11, color:muted, fontWeight:600, marginLeft:'auto' }}>
                  {filtered.length} dari {total} pegawai
                </span>
              </div>

              {/* Table */}
              <div style={{ background:card, border:`1px solid ${border}`, borderRadius:12, overflow:'hidden' }}>
                <div style={{ overflowX:'auto' }}>
                  <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
                    <thead style={{ background:dark?'#0f172a':'#f8fafc', position:'sticky', top:0, zIndex:1 }}>
                      <tr>
                        {['No','Nama / Jabatan','NIP','Status','Unit / TMT','Nomor HP','Operator','Urgensi','Keterangan','✓'].map((h,i)=>(
                          <th key={i} style={{ padding:'10px 12px', fontWeight:700, color:muted, textAlign:i===0||i>=5?'center':'left', fontSize:10, textTransform:'uppercase', letterSpacing:'0.05em', whiteSpace:'nowrap', borderBottom:`1px solid ${border}`, minWidth: i===2 ? '150px' : 'auto' }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {paginatedData.map((p, idx) => (
                        <tr key={p.id} style={{ borderBottom:`1px solid ${border}`, background: p.Status==='Done'?(dark?'rgba(16,185,129,0.05)':'#f0fdf4'):'transparent', transition:'background 0.15s' }}
                          onMouseEnter={e=>{ if(p.Status!=='Done') e.currentTarget.style.background=dark?'rgba(99,102,241,0.05)':'#f8f8ff'; }}
                          onMouseLeave={e=>{ e.currentTarget.style.background=p.Status==='Done'?(dark?'rgba(16,185,129,0.05)':'#f0fdf4'):'transparent'; }}>

                          <td style={{ padding:'8px 12px', textAlign:'center', fontWeight:700, color:muted, fontSize:11 }}>{(currentPage - 1) * itemsPerPage + idx + 1}</td>

                          <td style={{ padding:'8px 12px', maxWidth:200 }}>
                            <p style={{ margin:0, fontWeight:700, fontSize:12, color:'#4f46e5', lineHeight:1.3 }}>{p.Nama}</p>
                            <p style={{ margin:'2px 0 0', fontSize:10, color:muted, fontWeight:600 }}>{p.Pangkat} · {p.Jabatan}</p>
                          </td>

                          <td style={{ padding:'8px 12px', textAlign:'center', whiteSpace:'nowrap' }}>
                            <span style={{ fontFamily:'monospace', fontSize:11, fontWeight:600, color:text }}>{p.NIP || '-'}</span>
                          </td>

                          <td style={{ padding:'8px 12px', textAlign:'center' }}>
                            <span style={{
                              padding:'3px 8px', borderRadius:99, fontSize:10, fontWeight:800,
                              background: p.StatusPensiun === 'MD' ? '#fef2f2' : p.StatusPensiun === 'APS' ? '#fffbeb' : '#eff6ff',
                              color: p.StatusPensiun === 'MD' ? '#dc2626' : p.StatusPensiun === 'APS' ? '#d97706' : '#2563eb'
                            }}>
                              {p.StatusPensiun === 'MD' ? 'Meninggal Dunia' : p.StatusPensiun === 'APS' ? 'Pensiun Dini' : 'Batas Usia Pensiun'}
                            </span>
                          </td>

                          <td style={{ padding:'8px 12px', maxWidth:180 }}>
                            <p style={{ margin:0, fontSize:11, fontWeight:700, color:text, lineHeight:1.3 }}>{p.Unit}</p>
                            <p style={{ margin:'2px 0 0', fontSize:10, color:'#6366f1', fontWeight:700, display:'flex', alignItems:'center', gap:3 }}>
                              <I.clock s={10}/> {p.TMT}
                            </p>
                          </td>

                          <td style={{ padding:'8px 12px', textAlign:'center' }}>
                            <input
                              type="tel"
                              placeholder="No. HP"
                              value={phoneNumbers[p.id] || ''}
                              onChange={(e) => setPhoneNumbers(prev => ({...prev, [p.id]: e.target.value.replace(/[^0-9+\s-]/g, '')}))}
                              style={{
                                width:100,
                                padding:'4px 8px',
                                borderRadius:6,
                                border:`1px solid ${border}`,
                                background:inp,
                                color:text,
                                fontSize:10,
                                fontWeight:600,
                                textAlign:'center',
                                outline:'none'
                              }}
                            />
                          </td>

                          <td style={{ padding:'8px 12px', textAlign:'center' }}>
                            <span style={{ background:OP_BG[p.Operator]||'#f8fafc', color:OP_COLORS[p.Operator]||'#64748b', border:`1px solid ${OP_COLORS[p.Operator]}33`, padding:'3px 8px', borderRadius:6, fontSize:10, fontWeight:800, whiteSpace:'nowrap', display:'inline-block' }}>
                              {p.Operator}
                            </span>
                          </td>

                          <td style={{ padding:'8px 12px', textAlign:'center' }}>
                            <Badge type={p.urgency} label={p.urgencyLabel}/>
                          </td>

                          <td style={{ padding:'8px 12px', maxWidth:220 }}>
                            <p style={{ margin:0, fontSize:10, color:p.Status==='Done'?'#16a34a':muted, fontWeight:600, lineHeight:1.4 }}>{p.keterangan}</p>
                          </td>

                          <td style={{ padding:'8px 12px', textAlign:'center' }}>
                            <div style={{ display:'flex', gap:4, justifyContent:'center' }}>
                              <button onClick={()=>toggle(p.id)} title={p.Status==='Done'?'Tandai Pending':'Tandai Selesai'}
                                style={{ padding:6, borderRadius:8, border:'none', cursor: canEdit ? 'pointer' : 'not-allowed', background:p.Status==='Done'?'#16a34a':'transparent', color:p.Status==='Done'?'#fff':muted, display:'flex', alignItems:'center', boxShadow:p.Status==='Done'?'0 2px 8px rgba(22,163,74,0.3)':'none', borderWidth:1, borderStyle:'solid', borderColor:p.Status==='Done'?'#16a34a':border, opacity: canEdit ? 1 : 0.5 }}>
                                <I.clip s={15}/>
                              </button>
                              <button onClick={() => {
                                if (canEdit && window.confirm(`Apakah Anda yakin ingin menghapus pegawai ${p.Nama}?`)) {
                                  setData(data.filter(d => d.id !== p.id));
                                  alert('Pegawai berhasil dihapus!');
                                }
                              }} title="Hapus Pegawai"
                                style={{ padding:6, borderRadius:8, border:'none', cursor: canEdit ? 'pointer' : 'not-allowed', background:'#dc2626', color:'#fff', display:'flex', alignItems:'center', boxShadow:'0 2px 8px rgba(220,38,38,0.3)', opacity: canEdit ? 1 : 0.5 }}>
                                <I.xmark s={15}/>
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))}
                      {filtered.length===0 && (
                        <tr><td colSpan={10} style={{ padding:'32px', textAlign:'center', color:muted, fontWeight:600 }}>Tidak ada data yang sesuai filter</td></tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* Pagination */}
              {totalPages > 1 && (
                <div style={{ display:'flex', justifyContent:'center', alignItems:'center', gap:8, marginTop:16, padding:'12px', background:card, border:`1px solid ${border}`, borderRadius:12 }}>
                  <button
                    onClick={()=>setCurrentPage(p=>Math.max(1,p-1))}
                    disabled={currentPage===1}
                    style={{ padding:'6px 12px', borderRadius:8, border:`1px solid ${border}`, background:currentPage===1?'transparent':(dark?'#1e293b':'#fff'), color:currentPage===1?muted:text, cursor:currentPage===1?'not-allowed':'pointer', fontSize:12, fontWeight:700, display:'flex', alignItems:'center', gap:4, opacity:currentPage===1?0.5:1 }}
                  >
                    ← Prev
                  </button>
                  <span style={{ fontSize:12, fontWeight:700, color:muted, padding:'0 8px' }}>
                    Halaman {currentPage} dari {totalPages}
                  </span>
                  <button
                    onClick={()=>setCurrentPage(p=>Math.min(totalPages,p+1))}
                    disabled={currentPage===totalPages}
                    style={{ padding:'6px 12px', borderRadius:8, border:`1px solid ${border}`, background:currentPage===totalPages?'transparent':(dark?'#1e293b':'#fff'), color:currentPage===totalPages?muted:text, cursor:currentPage===totalPages?'not-allowed':'pointer', fontSize:12, fontWeight:700, display:'flex', alignItems:'center', gap:4, opacity:currentPage===totalPages?0.5:1 }}
                  >
                    Next →
                  </button>
                </div>
              )}

              {/* Footer */}
              <div style={{ textAlign:'center', padding:'20px', marginTop:8, color:muted, fontSize:11, fontWeight:600 }}>
                Created by Dika Haryanto 2026
              </div>
            </div>
          )}

          {/* ══ TAMBAH PEGAWAI TAB ══ */}
          {tab==='tambah' && canAdd && (
            <div>
              <div style={{ background:card, border:`1px solid ${border}`, borderRadius:12, padding:'16px 18px', marginBottom:16 }}>
                <h2 style={{ fontSize:16, fontWeight:800, margin:'0 0 8px', color:text }}>
                  <span style={{ display:'flex', alignItems:'center', gap:8 }}>
                    <I.person s={20} st={{ color:'#4f46e5' }}/>
                    Tambah Pegawai Baru (MD/APS)
                  </span>
                </h2>
                <p style={{ fontSize:12, color:muted, margin:0 }}>
                  Tambahkan data pegawai yang Meninggal Dunia (MD) atau Pensiun Dini (APS)
                </p>
              </div>

              {/* Form Tambah Pegawai */}
              <div style={{ background:card, border:`1px solid ${border}`, borderRadius:12, padding:'20px 24px' }}>
                <form onSubmit={handleAddEmployee}>
                  <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(250px, 1fr))', gap:16 }}>
                    <div>
                      <label style={{ display:'block', fontSize:11, fontWeight:700, color:muted, marginBottom:6, textTransform:'uppercase', letterSpacing:'0.05em' }}>Nama Lengkap *</label>
                      <input
                        type="text"
                        required
                        value={newEmployee.Nama}
                        onChange={(e) => setNewEmployee({...newEmployee, Nama: e.target.value})}
                        style={{ ...selStyle, width:'100%' }}
                        placeholder="Masukkan nama lengkap"
                      />
                    </div>
                    <div>
                      <label style={{ display:'block', fontSize:11, fontWeight:700, color:muted, marginBottom:6, textTransform:'uppercase', letterSpacing:'0.05em' }}>NIP *</label>
                      <input
                        type="text"
                        required
                        value={newEmployee.NIP}
                        onChange={(e) => setNewEmployee({...newEmployee, NIP: e.target.value})}
                        style={{ ...selStyle, width:'100%' }}
                        placeholder="Masukkan NIP"
                      />
                    </div>
                    <div>
                      <label style={{ display:'block', fontSize:11, fontWeight:700, color:muted, marginBottom:6, textTransform:'uppercase', letterSpacing:'0.05em' }}>Pangkat</label>
                      <input
                        type="text"
                        value={newEmployee.Pangkat}
                        onChange={(e) => setNewEmployee({...newEmployee, Pangkat: e.target.value})}
                        style={{ ...selStyle, width:'100%' }}
                        placeholder="Masukkan pangkat"
                      />
                    </div>
                    <div>
                      <label style={{ display:'block', fontSize:11, fontWeight:700, color:muted, marginBottom:6, textTransform:'uppercase', letterSpacing:'0.05em' }}>Jabatan</label>
                      <input
                        type="text"
                        value={newEmployee.Jabatan}
                        onChange={(e) => setNewEmployee({...newEmployee, Jabatan: e.target.value})}
                        style={{ ...selStyle, width:'100%' }}
                        placeholder="Masukkan jabatan"
                      />
                    </div>
                    <div>
                      <label style={{ display:'block', fontSize:11, fontWeight:700, color:muted, marginBottom:6, textTransform:'uppercase', letterSpacing:'0.05em' }}>Unit Kerja</label>
                      <input
                        type="text"
                        value={newEmployee.Unit}
                        onChange={(e) => setNewEmployee({...newEmployee, Unit: e.target.value})}
                        style={{ ...selStyle, width:'100%' }}
                        placeholder="Masukkan unit kerja"
                      />
                    </div>
                    <div>
                      <label style={{ display:'block', fontSize:11, fontWeight:700, color:muted, marginBottom:6, textTransform:'uppercase', letterSpacing:'0.05em' }}>TMT</label>
                      <input
                        type="date"
                        value={newEmployee.TMT}
                        onChange={(e) => setNewEmployee({...newEmployee, TMT: e.target.value})}
                        style={{ ...selStyle, width:'100%' }}
                      />
                    </div>
                    <div>
                      <label style={{ display:'block', fontSize:11, fontWeight:700, color:muted, marginBottom:6, textTransform:'uppercase', letterSpacing:'0.05em' }}>Status Pensiun *</label>
                      <select
                        required
                        value={newEmployee.StatusPensiun}
                        onChange={(e) => setNewEmployee({...newEmployee, StatusPensiun: e.target.value})}
                        style={{ ...selStyle, width:'100%' }}
                      >
                        <option value="MD">MD (Meninggal Dunia)</option>
                        <option value="APS">APS (Pensiun Dini)</option>
                        <option value="BUP">BUP (Batas Usia Pensiun)</option>
                      </select>
                    </div>
                  </div>
                  <div style={{ marginTop:20, display:'flex', gap:12 }}>
                    <button type="submit" style={{ padding:'10px 24px', borderRadius:8, border:'none', background:'#4f46e5', color:'#fff', fontSize:12, fontWeight:700, cursor:'pointer', display:'flex', alignItems:'center', gap:6 }}>
                      <I.check2 s={14}/> Simpan Pegawai
                    </button>
                    <button type="button" onClick={() => setTab('monitoring')} style={{ padding:'10px 24px', borderRadius:8, border:`1px solid ${border}`, background:'transparent', color:muted, fontSize:12, fontWeight:700, cursor:'pointer' }}>
                      Batal
                    </button>
                    <button type="button" onClick={() => {
                      const lastEmployee = data[data.length - 1];
                      if (lastEmployee) {
                        handleDeleteEmployee(lastEmployee.id);
                      }
                    }} style={{ padding:'10px 24px', borderRadius:8, border:'none', background:'#dc2626', color:'#fff', fontSize:12, fontWeight:700, cursor:'pointer', display:'flex', alignItems:'center', gap:6 }}>
                      <I.xmark s={14}/> Hapus Pegawai Terakhir
                    </button>
                  </div>
                </form>
              </div>

              {/* Info Box */}
              <div style={{ marginTop:16, background:'#fef3c7', border:'1px solid #fcd34d', borderRadius:12, padding:'16px 18px' }}>
                <h3 style={{ fontSize:13, fontWeight:800, margin:'0 0 8px', color:'#92400e' }}>
                  <span style={{ display:'flex', alignItems:'center', gap:6 }}>
                    <I.alert s={14}/> Informasi Penting
                  </span>
                </h3>
                <ul style={{ fontSize:12, color:'#92400e', margin:0, paddingLeft:20 }}>
                  <li style={{ marginBottom:4 }}>Pastikan data yang dimasukkan sudah benar sebelum menyimpan</li>
                  <li style={{ marginBottom:4 }}>Status MD untuk pegawai yang Meninggal Dunia</li>
                  <li style={{ marginBottom:4 }}>Status APS untuk pegawai yang Pensiun Dini</li>
                  <li>Data yang ditambahkan akan muncul di Database Pegawai dan Statistik</li>
                </ul>
              </div>
            </div>
          )}

          {/* ══ PENSIONIR PER BULAN TAB ══ */}
          {tab==='pensiunan-bulan' && (
            <div>
              <div style={{ background:card, border:`1px solid ${border}`, borderRadius:12, padding:'16px 18px', marginBottom:16 }}>
                <h2 style={{ fontSize:16, fontWeight:800, margin:'0 0 8px', color:text }}>
                  <span style={{ display:'flex', alignItems:'center', gap:8 }}>
                    <I.calendar s={20} st={{ color:'#4f46e5' }}/>
                    Daftar Pensiunan Berdasarkan Bulan TMT
                  </span>
                </h2>
                <p style={{ fontSize:12, color:muted, margin:0 }}>
                  Pilih bulan untuk melihat nama-nama pensiunan berdasarkan Tanggal Mulai Tugas (TMT) pensiun
                </p>
              </div>

              {/* Month Selection */}
              <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(100px,1fr))', gap:8, marginBottom:16 }}>
                {Array.from({length:12},(_,i)=>{
                  const m = i + 1;
                  const count = processed.filter(p => parseInt(p.TMT.substring(5,7)) === m).length;
                  return (
                    <button key={m} onClick={()=>setFilterMonth(filterMonth===m?'':m)} 
                      style={{ 
                        padding:'12px 16px', 
                        borderRadius:10, 
                        border:`2px solid ${filterMonth===m?'#4f46e5':border}`, 
                        background: filterMonth===m ? '#eef2ff' : card,
                        cursor:'pointer',
                        textAlign:'center',
                        transition:'all 0.15s'
                      }}>
                      <div style={{ fontSize:18, fontWeight:900, color: filterMonth===m?'#4f46e5':text }}>{MONTHS[m]}</div>
                      <div style={{ fontSize:11, color:muted, fontWeight:600 }}>{count} orang</div>
                    </button>
                  );
                })}
              </div>

              {/* Selected Month Data */}
              {filterMonth ? (
                <div style={{ background:card, border:`1px solid ${border}`, borderRadius:12, overflow:'hidden' }}>
                  <div style={{ padding:'12px 16px', borderBottom:`1px solid ${border}`, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                    <h3 style={{ fontSize:14, fontWeight:800, margin:0, color:text }}>
                      Pensiunan Bulan {MONTHS[parseInt(filterMonth)]} 2026
                    </h3>
                    <span style={{ fontSize:12, color:muted, fontWeight:600 }}>
                      {processed.filter(p => parseInt(p.TMT.substring(5,7)) === parseInt(filterMonth)).length} orang
                    </span>
                  </div>
                  
                  <div style={{ overflowX:'auto' }}>
                    <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
                      <thead style={{ background:dark?'#0f172a':'#f8fafc' }}>
                        <tr>
                          {['No','Nama','NIP','Pangkat','Jabatan','Unit Kerja','Status','No. HP'].map((h,i)=>(
                            <th key={i} style={{ padding:'10px 12px', fontWeight:700, color:muted, textAlign:i===0?'center':'left', fontSize:10, textTransform:'uppercase', letterSpacing:'0.05em', borderBottom:`1px solid ${border}`, minWidth: i===2 ? '150px' : 'auto' }}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {processed
                          .filter(p => parseInt(p.TMT.substring(5,7)) === parseInt(filterMonth))
                          .sort((a,b) => a.TMT.localeCompare(b.TMT))
                          .map((p, idx) => (
                          <tr key={p.id} style={{ borderBottom:`1px solid ${border}` }}>
                            <td style={{ padding:'8px 12px', textAlign:'center', fontWeight:700, color:muted }}>{idx + 1}</td>
                            <td style={{ padding:'8px 12px', fontWeight:700, color:'#4f46e5' }}>{p.Nama}</td>
                            <td style={{ padding:'8px 12px', fontFamily:'monospace', fontSize:11, whiteSpace:'nowrap' }}>{p.NIP || '-'}</td>
                            <td style={{ padding:'8px 12px' }}>{p.Pangkat}</td>
                            <td style={{ padding:'8px 12px', maxWidth:180 }}>{p.Jabatan}</td>
                            <td style={{ padding:'8px 12px', maxWidth:160 }}>{p.Unit}</td>
                            <td style={{ padding:'8px 12px' }}>
                              <span style={{ padding:'2px 6px', borderRadius:4, fontSize:10, fontWeight:700, background: '#eff6ff', color: '#2563eb' }}>
                                BUP
                              </span>
                            </td>
                            <td style={{ padding:'8px 12px' }}>
                              <input
                                type="tel"
                                placeholder="No. HP"
                                value={phoneNumbers[p.id] || ''}
                                onChange={(e) => setPhoneNumbers(prev => ({...prev, [p.id]: e.target.value.replace(/[^0-9+\s-]/g, '')}))}
                                style={{
                                  width:100,
                                  padding:'4px 8px',
                                  borderRadius:6,
                                  border:`1px solid ${border}`,
                                  background:inp,
                                  color:text,
                                  fontSize:10,
                                  fontWeight:600,
                                  textAlign:'center',
                                  outline:'none'
                                }}
                              />
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {/* Export buttons for this month */}
                  <div style={{ padding:'12px 16px', borderTop:`1px solid ${border}`, display:'flex', gap:8, flexWrap:'wrap' }}>
                    <button onClick={()=>{
                      try {
                        const monthData = processed.filter(p => parseInt(p.TMT.substring(5,7)) === parseInt(filterMonth));
                        const wsData = [['No', 'Nama', 'NIP', 'Pangkat', 'Jabatan', 'Unit Kerja', 'TMT', 'Status Pensiun', 'Nomor HP']];
                        monthData.sort((a,b) => a.TMT.localeCompare(b.TMT)).forEach((p, idx) => {
                          wsData.push([idx + 1, p.Nama, p.NIP || '', p.Pangkat, p.Jabatan, p.Unit, p.TMT, 'BUP', phoneNumbers[p.id] || '']);
                        });
                        const ws = XLSX.utils.aoa_to_sheet(wsData);
                        const wb = XLSX.utils.book_new();
                        XLSX.utils.book_append_sheet(wb, ws, 'Pensiunan');
                        XLSX.writeFile(wb, `pensiunan_${MONTHS[parseInt(filterMonth)]}_2026.xlsx`);
                      } catch (err) { alert('Gagal mengekspor Excel: ' + err.message); }
                    }} style={{ padding:'7px 14px', borderRadius:8, border:'none', background:'#7c3aed', cursor:'pointer', color:'#fff', fontSize:11, fontWeight:700, display:'flex', alignItems:'center', gap:4 }}>
                      <I.clip s={12}/> Export Excel
                    </button>
                    <button onClick={()=>{
                      try {
                        const { jsPDF } = window.jspdf;
                        const doc = new jsPDF();
                        const monthData = processed.filter(p => parseInt(p.TMT.substring(5,7)) === parseInt(filterMonth)).sort((a,b) => a.TMT.localeCompare(b.TMT));
                        const tableData = monthData.map((p, idx) => [
                          idx + 1,
                          p.Nama,
                          p.NIP || '-',
                          p.Pangkat,
                          p.Jabatan.substring(0, 25),
                          p.Unit.substring(0, 20),
                          p.TMT,
                          'BUP',
                          phoneNumbers[p.id] || '-'
                        ]);
                        doc.autoTable({
                          head: [['No', 'Nama', 'NIP', 'Pangkat', 'Jabatan', 'Unit', 'TMT', 'Jenis', 'No. HP']],
                          body: tableData,
                          startY: 20,
                          styles: { fontSize: 8, cellPadding: 2 },
                          headStyles: { fillColor: [124, 58, 237] },
                          columnStyles: {
                            0: { cellWidth: 10 },
                            1: { cellWidth: 40 },
                            2: { cellWidth: 25 },
                            3: { cellWidth: 15 },
                            4: { cellWidth: 35 },
                            5: { cellWidth: 25 },
                            6: { cellWidth: 18 },
                            7: { cellWidth: 12 },
                            8: { cellWidth: 25 }
                          }
                        });
                        doc.text(`Daftar Pensiunan Bulan ${MONTHS[parseInt(filterMonth)]} 2026`, 14, 15);
                        doc.save(`pensiunan_${MONTHS[parseInt(filterMonth)]}_2026.pdf`);
                      } catch (err) { alert('Gagal mengekspor PDF: ' + err.message); }
                    }} style={{ padding:'7px 14px', borderRadius:8, border:'none', background:'#dc2626', cursor:'pointer', color:'#fff', fontSize:11, fontWeight:700, display:'flex', alignItems:'center', gap:4 }}>
                      <I.clip s={12}/> Export PDF
                    </button>
                  </div>
                </div>
              ) : (
                <div style={{ background:card, border:`1px solid ${border}`, borderRadius:12, padding:'40px', textAlign:'center' }}>
                  <I.calendar s={48} st={{ color:muted, margin:'0 auto 16px', display:'block', opacity:0.5 }}/>
                  <p style={{ fontSize:14, color:muted, fontWeight:600, margin:0 }}>
                    Klik salah satu bulan di atas untuk melihat daftar pensiunan
                  </p>
                </div>
              )}
            </div>
          )}

          {/* ══ LOG AKSES TAB (SUPERADMIN ONLY) ══ */}
          {tab==='logs' && isSuperAdmin && (
            <div>
              <div style={{ background:card, border:`1px solid ${border}`, borderRadius:12, padding:'16px 18px', marginBottom:16 }}>
                <h2 style={{ fontSize:16, fontWeight:800, margin:'0 0 8px', color:text }}>
                  <span style={{ display:'flex', alignItems:'center', gap:8 }}>
                    <I.shield s={20} st={{ color:'#dc2626' }}/>
                    Log Akses Pengguna
                  </span>
                </h2>
                <p style={{ fontSize:12, color:muted, margin:0 }}>
                  Riwayat akses seluruh pengguna sistem
                </p>
              </div>

              {/* Access Logs Table */}
              <div style={{ background:card, border:`1px solid ${border}`, borderRadius:12, overflow:'hidden' }}>
                <div style={{ overflowX:'auto' }}>
                  <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
                    <thead style={{ background:dark?'#0f172a':'#f8fafc' }}>
                      <tr>
                        {['No','Username','Aksi','Detail','Waktu'].map((h,i)=>(
                          <th key={i} style={{ padding:'10px 12px', fontWeight:700, color:muted, textAlign:i===0?'center':'left', fontSize:10, textTransform:'uppercase', letterSpacing:'0.05em', borderBottom:`1px solid ${border}` }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {accessLogs.length === 0 ? (
                        <tr>
                          <td colSpan={5} style={{ padding:'32px', textAlign:'center', color:muted, fontWeight:600 }}>
                            Belum ada log akses
                          </td>
                        </tr>
                      ) : (
                        accessLogs.map((log, idx) => (
                          <tr key={log.id} style={{ borderBottom:`1px solid ${border}` }}>
                            <td style={{ padding:'8px 12px', textAlign:'center', fontWeight:700, color:muted }}>{idx + 1}</td>
                            <td style={{ padding:'8px 12px' }}>
                              <span style={{ fontFamily:'monospace', fontSize:11, fontWeight:600, color:'#4f46e5', background:'#eef2ff', padding:'2px 6px', borderRadius:4 }}>
                                {log.username}
                              </span>
                            </td>
                            <td style={{ padding:'8px 12px' }}>
                              <span style={{
                                padding:'3px 8px', borderRadius:99, fontSize:10, fontWeight:800,
                                background: log.action === 'LOGIN' ? '#f0fdf4' : log.action === 'LOGOUT' ? '#fffbeb' : '#fef2f2',
                                color: log.action === 'LOGIN' ? '#16a34a' : log.action === 'LOGOUT' ? '#d97706' : '#dc2626'
                              }}>
                                {log.action}
                              </span>
                            </td>
                            <td style={{ padding:'8px 12px', fontSize:11, color:text }}>
                              {log.details}
                            </td>
                            <td style={{ padding:'8px 12px', fontSize:10, color:muted, fontFamily:'monospace' }}>
                              {new Date(log.timestamp).toLocaleString('id-ID')}
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
